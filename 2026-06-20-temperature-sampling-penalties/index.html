<main class="post"><a class="back" href="/blog/">← All posts</a><h1>The Temperature Knob</h1><p class="sub" style="margin-bottom:10px">How LLM sampling really works</p><p class="pmeta" style="margin-top:0">Jun 20, 2026 &nbsp;·&nbsp; <span class="tg">tutorials</span> <span class="tg">llm</span> <span class="tg">decoding</span> <span class="tg">notes</span></p><img class="cover-img" src="/assets/site/covers/temperature.svg" alt=""><article class="prose" id="content"></article><div class="share"><span>Share</span><a href="https://twitter.com/intent/tweet?text=The%20Temperature%20Knob&url=https%3A%2F%2Fzhanqizhang66.github.io%2F2026-06-20-temperature-sampling-penalties%2F" aria-label="Share on X"><i class="fa-brands fa-x-twitter"></i></a><a href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fzhanqizhang66.github.io%2F2026-06-20-temperature-sampling-penalties%2F" aria-label="Share on Facebook"><i class="fa-brands fa-facebook"></i></a><a href="https://www.linkedin.com/shareArticle?mini=true&url=https%3A%2F%2Fzhanqizhang66.github.io%2F2026-06-20-temperature-sampling-penalties%2F" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin"></i></a><button type="button" id="copylink" data-u="https://zhanqizhang66.github.io/2026-06-20-temperature-sampling-penalties/" aria-label="Copy link"><i class="fa-solid fa-link"></i></button></div><section class="comments"><h3>Likes and comments</h3><div id="disqus_thread"></div></section><script>document.getElementById("copylink").onclick=function(){var b=this;navigator.clipboard&&navigator.clipboard.writeText(b.getAttribute("data-u")).then(function(){b.classList.add("ok");setTimeout(function(){b.classList.remove("ok");},1200);});};var disqus_config=function(){this.page.url="https://zhanqizhang66.github.io/2026-06-20-temperature-sampling-penalties/";};(function(){var d=document.createElement("script");d.async=true;d.src="https://https-zhanqizhang66-github-io.disqus.com/embed.js";document.body.appendChild(d);})();</scrip <script>window.MATH=true;window.MD="The last layer of a language model does not emit a probability. It emits **logits**, a vector of real numbers. A probability distribution only appears after we push those logits through a softmax. The entire secret of *temperature* lives in the step just before the softmax: we divide every logit by a single scalar $T$.\n\n## 1. Temperature: making the distribution sharper or flatter\n\nA useful mental picture is a pot of porridge. The grains, beans, and squash are already in there in fixed proportions, and turning the heat up or down does not change what is in the pot, only how sharply the ingredients stand out from one another. Temperature does the same thing to a token distribution. It never changes the **ranking** of tokens, only the **gaps** between neighboring probabilities.\n\nFormally, we scale each logit by $1/T$ and then take the softmax:\n\n$$\nP(x_i) = \\frac{\\exp(z_i/T)}{\\sum_j \\exp(z_j/T)}\n$$\n\nThree limiting values make the behavior obvious:\n\n- **$T \\to 0$.** The largest logit is exponentially amplified until it dominates everything. The distribution collapses to a single spike, which is exactly `argmax`, i.e. greedy decoding. Greedy is not \"temperature-free\"; it is the limit of temperature going to zero.\n- **$T = 1$.** Nothing is changed. This is the natural distribution the model saw during training.\n- **$T \\to \\infty$.** Every logit is squeezed toward $0$, the distribution approaches uniform, and the model is effectively drawing tokens at random from the vocabulary. The text falls apart immediately.\n\nIn practice $T$ usually lives somewhere around $0.2$ to $1.2$: lower for factual question answering, higher for creative writing. There is no universally \"correct\" value. A higher temperature raises the chance of sampling low-probability tokens and increases drift, but it does not *necessarily* produce gibberish. Whether the text survives depends on how flat the underlying distribution already is.\n\nThis points to one frequent source of confusion: **temperature scaling only matters when you sample.** If you take a pure greedy or `argmax` path, dividing all logits by a positive constant never changes the ordering, so the chosen token is identical. Where there is no randomness, the temperature knob spins in the void.\n\n### Temperature does not work in isolation\n\nReal systems apply temperature *before* candidate truncation. The semantic order is almost always:\n\n1. temperature scaling,\n2. candidate truncation (top-$k$ / top-$p$),\n3. renormalize over the survivors and sample.\n\nThis order matters. If you truncated first and scaled second, temperature would lose its influence over *which tokens make it into the candidate set*. Because scaling comes first, even adjusting temperature alone indirectly resizes the top-$p$ nucleus. A sharper distribution yields a smaller, more focused nucleus, while a flatter one yields a larger, more divergent nucleus.\n\n## 2. Why models get stuck in loops: the feedback loop\n\nTuning temperature well does not guarantee good output. A classic failure is the model getting trapped in a repetition it cannot escape, as in *\"this movie is very very very very \u2026\"*, or, more subtly, circling the same sentence over and over. This is called **pattern collapse** (colloquially, \"the stuck record\"). It is worst under greedy decoding, but it still happens with temperature sampling. Why?\n\nThe cause is the self-reinforcing feedback loop of autoregressive generation:\n\n1. At step $t$ the model samples a token $x_t$.\n2. $x_t$ is appended to the context and becomes part of the input at step $t+1$.\n3. A local pattern that has already formed (e.g. \"very very very\") enters the context, and the model readily reads it as a pattern that is *still continuing*, especially under greedy, beam, or low-diversity sampling.\n4. Once the same token has been sampled into the context several times, \"one more of the same\" becomes an even stronger candidate. The pattern pulls itself into being the next most-likely token.\n\nFormally, given the already-generated sequence $x_{<t}$, the next-step distribution is simply\n\n$$\nP(x_t \\mid x_{<t}) = \\mathrm{softmax}\\big(f_\\theta(x_{<t})\\big).\n$$\n\nThe model does not \"know\" it is repeating. It only sees that \"very\" has appeared three times and, by the regularities it learned, judges a fourth \"very\" to be a reasonable continuation. This is structural, not a sign the model got dumber. Unless the sampling strategy actively breaks up the local pattern, the loop reinforces itself.\n\n## 3. Three penalties: operating directly on the distribution\n\nIf the loop comes from \"already-generated tokens raising their own probability,\" the cure is direct: actively push down the probability of tokens that have already appeared, *before* each sampling step. That is what penalties do. They all act on the logits before softmax, but their mechanisms differ.\n\nThere is an important detail that is easy to miss. Penalties count **tokens**, not words and certainly not sentences. A word may be split into two tokens, and two semantically unrelated pieces of text may happen to share a high-frequency token. Both change what the penalty actually touches.\n\nLet $z_i$ be the current-step logit of token $i$ and $c_i$ its count in the already-generated sequence.\n\n**Repetition penalty** (HuggingFace style) discounts a token's logit multiplicatively if it has appeared:\n\n$$\nz_i' =\n\\begin{cases}\nz_i / \\alpha, & z_i \\ge 0 \\\\\nz_i \\cdot \\alpha, & z_i < 0\n\\end{cases}\n\\qquad (\\text{if } i \\text{ has appeared})\n$$\n\nWith $\\alpha > 1$, positive logits shrink and negative logits grow more negative, pushing the probability of seen tokens down across the board. $\\alpha = 1.0$ means no penalty; $1.1$ to $1.3$ is common. It does not distinguish one occurrence from ten, since appearing even once triggers the cut.\n\n**Frequency penalty** (OpenAI style) subtracts a score linearly in the number of occurrences:\n\n$$\nz_i' = z_i - \\beta \\, c_i\n$$\n\nWith $\\beta > 0$, a token seen five times loses $5\\beta$ and one seen once loses $\\beta$. This is finer-grained than the repetition penalty, because the more something repeats, the harder it is pushed down, which suits the \"high-frequency filler word keeps reappearing\" failure mode.\n\n**Presence penalty** (also OpenAI style) only checks whether a token has appeared at all:\n\n$$\nz_i' = z_i - \\gamma \\, \\mathbb{1}[c_i > 0]\n$$\n\nAny token that has appeared once is reduced by $\\gamma$, and no more. Its purpose is not to cure repetition but to **encourage new vocabulary**, which is useful when you want topical breadth, e.g. covering more subjects in a summary.\n\nHow to choose? For open-ended generation and continuation, frequency penalty is usually most effective, because the stuck-record disease is fundamentally driven by counts. If you only want to avoid topical poverty, presence penalty suffices, and repetition penalty is an older but simple, robust fallback. The three do not replace one another, but using all three at once is rare, since they fight each other.\n\n## 4. The three layers behind \"talking nonsense\"\n\nFinally, there is *hallucination*, when a model confidently invents a nonexistent fact, cites a paper that was never written, or hands you a wrong API name. The full topic is far larger than decoding, but the part visible from the decoding side makes a good closing, because it connects the \"temperature, sampling, penalty\" thread to \"why the model is wrong.\" There are at least three stacked layers.\n\n**Layer 1: sampling drift.** As long as $T > 0$, every step has some probability of drawing a non-optimal token. A single suboptimal draw is harmless, but over a long sequence these small drifts **accumulate along the autoregressive loop**: a slight wobble early on grows into a large deviation by token 200. Setting $T = 0$ removes this layer, at the cost of pinning generation quality to the greedy ceiling (repetition included).\n\n**Layer 2: long-tail amplification.** Top-$p$ was designed to cut off the unreliable tail: when the distribution is sharp the nucleus tightens, and only when it is flat does the nucleus widen. The problem is that it cannot tell \"flat because the model is genuinely weighing several reasonable options\" from \"flat because the model cannot tell the boundary.\" Exactly where the model is unsure (say, what follows a rare proper noun), the distribution naturally flattens, the nucleus expands, and more low-probability tokens are admitted. A slightly high temperature flattens it further, admitting yet more. Once one of these tokens is drawn, it becomes the seed of fabricated content: it was never high-probability, and sampling promoted it to the page.\n\n**Layer 3: model overconfidence (out-of-distribution).** The first two layers assume the model is at least honest about its own uncertainty, but it often is not. When the input falls outside the training distribution (OOD), the model frequently still produces a *sharp* distribution: it has not seen this question, yet it overlays patterns learned from similar ones and outputs a confident-looking answer. This layer has nothing to do with sampling or penalties. Set $T = 0$, turn every penalty off, and the model will still make things up.\n\nThe key boundary is this: the first two layers can be *mitigated* by tuning sampling, but the third cannot. Blaming every hallucination on \"temperature too high\" is a misdiagnosis, and conversely, crushing temperature to $0$ will not make the model start telling the truth. Factual correctness relies far more on structural safeguards, such as external retrieval, citation checking, tool calls, and refusal mechanisms, than on the decoder. Sampling is only one very thin filter in that stack.\n\n## Wrap-up\n\nBy now the picture of generation should have sharpened from \"the model emits tokens\" to something richer: at every step the model emits a *distribution*; everything we do to that distribution, whether temperature scaling, top-$k$/top-$p$ truncation, or the various penalties, jointly decides the next token; and the failure modes of generation (repetition, drift, hallucination) are not the model getting dumber, but structural consequences of the distribution, the sampler, and the model's own limits stacked together.\n\n**References**\n\n- Holtzman et al., *The Curious Case of Neural Text Degeneration*, ICLR 2020. [arXiv:1904.09751](https://arxiv.org/abs/1904.09751). The original top-$p$ / nucleus sampling paper.\n- OpenAI Platform Docs, *Frequency and presence penalties*: official definitions and suggested ranges.\n- Welleck et al., *Neural Text Generation with Unlikelihood Training*, ICLR 2020. [arXiv:1908.04319](https://arxiv.org/abs/1908.04319). On curing repetition from the training-objective side.\n- Ji et al., *Survey of Hallucination in Natural Language Generation*, ACM Computing Surveys 2023. [arXiv:2202.03629](https://arxiv.org/abs/2202.03629).\n\n---\n\n*Note: these notes are compiled from sources on the internet and are not my original work. I plan to rewrite them in my own words later.*\n";</script><script>
